<div class="flex min-w-0 flex-auto flex-col">
    <!-- HEADER -->
    <div
        class="bg-card flex flex-0 flex-col border-b p-6 sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:py-8 dark:bg-transparent"
    >
        <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center font-medium">
                <div>
                    <a class="whitespace-nowrap text-primary-500">
                        Administración
                    </a>
                </div>
                <div class="ml-1 flex items-center whitespace-nowrap">
                    <mat-icon
                        class="text-secondary icon-size-5"
                        [svgIcon]="'heroicons_mini:chevron-right'"
                    ></mat-icon>
                    <a class="ml-1 text-primary-500"> Accesos y Seguridad </a>
                </div>
            </div>

            <div class="mt-2">
                <h2
                    class="truncate text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl"
                >
                    Restablecer contraseña del usuario
                </h2>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="flex-auto p-6 sm:p-10">
        <div class="max-w-4xl">
            <div class="rounded-xl bg-white p-6 shadow-sm dark:bg-gray-900">
                <form
                    [formGroup]="unlockForm"
                    class="grid gap-6 sm:grid-cols-2"
                >
                    <!-- USUARIO -->
                    <mat-form-field class="w-full sm:col-span-2">
                        <mat-label>Usuario</mat-label>
                        <mat-select
                            formControlName="usuario_id"
                            (selectionChange)="onUserChange($event.value)"
                        >
                            @for (u of users; track u.id) {
                                <mat-option [value]="u.id">
                                    {{ u.first_name }}
                                    {{ u.full_last_name }} ({{ u.email }})
                                </mat-option>
                            }
                        </mat-select>
                        <mat-error>Seleccione un usuario</mat-error>
                    </mat-form-field>

                    <mat-form-field class="w-full sm:col-span-2">
                        <mat-label>Email</mat-label>
                        <input matInput formControlName="email" readonly />
                    </mat-form-field>

                    @if (false) {
                        <mat-form-field class="w-full sm:col-span-2">
                            <mat-label>Contraseña temporal</mat-label>
                            <input
                                matInput
                                value="123"
                                [type]="hidePassword ? 'password' : 'text'"
                                formControlName="password"
                                autocomplete="off"
                            />
                            <button
                                mat-icon-button
                                matSuffix
                                type="button"
                                (click)="hidePassword = !hidePassword"
                            >
                                <mat-icon>
                                    {{
                                        hidePassword
                                            ? 'visibility'
                                            : 'visibility_off'
                                    }}
                                </mat-icon>
                            </button>
                            <mat-error>
                                Ingrese la contraseña temporal
                            </mat-error>
                        </mat-form-field>
                    }

                    <!-- ACCIONES -->
                    <div class="flex justify-end sm:col-span-2">
                        <button
                            mat-flat-button
                            color="primary"
                            type="button"
                            (click)="unlockUser()"
                            [disabled]="unlockForm.invalid"
                        >
                            <mat-icon
                                svgIcon="heroicons_outline:lock-open"
                            ></mat-icon>
                            <span class="ml-2">Desbloquear usuario</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
