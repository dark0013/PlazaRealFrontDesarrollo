<div class="flex min-w-0 flex-auto flex-col">
    <div
        class="bg-card flex flex-0 flex-col border-b p-6 sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:py-8"
    >
        <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center font-medium">
                <a class="text-primary-500">Operación</a>
                <mat-icon
                    class="text-secondary mx-1 icon-size-5"
                    svgIcon="heroicons_mini:chevron-right"
                ></mat-icon>
                <span class="text-primary-500">Reportes</span>
            </div>

            <h2
                class="mt-2 text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl"
            >
                Reporte de Reservas de Escenarios
            </h2>
        </div>
    </div>

    <div class="flex-auto p-6 sm:p-10">
        <div class="max-w-10xl">
            <div
                class="mb-6 rounded-xl bg-gray-50 p-6 shadow-sm dark:bg-gray-800"
            >
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-4">
                    <mat-form-field class="w-full">
                        <mat-label>Escenario</mat-label>
                        <mat-select
                            [(value)]="filters.venueId"
                            (selectionChange)="loadReservations()"
                        >
                            <mat-option value="">Todos</mat-option>
                            @for (v of venues; track v.id) {
                                <mat-option [value]="v.id">
                                    {{ v.name }}
                                </mat-option>
                            }
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field class="w-full">
                        <mat-label>Desde</mat-label>
                        <input
                            matInput
                            [matDatepicker]="fromPicker"
                            [(ngModel)]="filters.fromDate"
                            (dateChange)="loadReservations()"
                        />
                        <mat-datepicker-toggle
                            matSuffix
                            [for]="fromPicker"
                        ></mat-datepicker-toggle>
                        <mat-datepicker #fromPicker></mat-datepicker>
                    </mat-form-field>

                    <mat-form-field class="w-full">
                        <mat-label>Hasta</mat-label>
                        <input
                            matInput
                            [matDatepicker]="toPicker"
                            [(ngModel)]="filters.toDate"
                            (dateChange)="loadReservations()"
                        />
                        <mat-datepicker-toggle
                            matSuffix
                            [for]="toPicker"
                        ></mat-datepicker-toggle>
                        <mat-datepicker #toPicker></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>

            <div
                class="relative flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center sm:justify-between md:px-8"
            >
                <div class="text-3xl font-extrabold tracking-tight">
                    Reservas Asignadas
                </div>

                <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
                    <button
                        mat-flat-button
                        color="accent"
                        (click)="exportToExcel()"
                    >
                        <mat-icon
                            svgIcon="heroicons_outline:arrow-down-tray"
                        ></mat-icon>
                        <span class="ml-2">Exportar Excel</span>
                    </button>
                </div>
            </div>

            <div class="rounded-xl bg-white p-6 shadow-sm dark:bg-gray-900">
                <table mat-table [dataSource]="reservations" class="w-full">
                    <ng-container matColumnDef="venue">
                        <th mat-header-cell *matHeaderCellDef>Escenario</th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.venue }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef>Fecha</th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.date | date: 'dd/MM/yyyy' }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="time">
                        <th mat-header-cell *matHeaderCellDef>Horario</th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.time }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="match">
                        <th mat-header-cell *matHeaderCellDef>Encuentro</th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.match }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="category">
                        <th mat-header-cell *matHeaderCellDef>Categoría</th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.category }}
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumns"
                    ></tr>
                </table>
            </div>
        </div>
    </div>
</div>
