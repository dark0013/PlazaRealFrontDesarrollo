<div
    class="flex h-16 flex-0 items-center justify-between bg-primary pl-6 pr-3 text-on-primary sm:pl-8 sm:pr-5"
>
    <div class="text-lg font-medium">Rol</div>
</div>

<hr />
<div mat-dialog-content>
    <div class="w-full">
        <form [formGroup]="accountForm">
            <div class="mt-8 grid w-full gap-6 sm:grid-cols-4">
                <div class="sm:col-span-2">
                    <mat-form-field
                        class="w-full"
                        [subscriptSizing]="'dynamic'"
                    >
                        <mat-label>Nombre</mat-label>
                        <!-- <mat-icon class="icon-size-5" svgIcon="heroicons_outline:information-circle" matPrefix></mat-icon> -->
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:information-circle'"
                            matPrefix
                        ></mat-icon>
                        <input
                            [formControlName]="'nombre'"
                            matInput
                            [readonly]="readonlyMode"
                        />
                    </mat-form-field>
                </div>

                <div class="sm:col-span-2">
                    <mat-form-field
                        class="w-full"
                        [subscriptSizing]="'dynamic'"
                    >
                        <mat-label>Descripción (Opcional)</mat-label>
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:information-circle'"
                            matPrefix
                        ></mat-icon>
                        <input
                            [formControlName]="'descripcion'"
                            matInput
                            [readonly]="readonlyMode"
                        />
                    </mat-form-field>
                </div>
            </div>

            <div class="mb-10 mt-11 border-t"></div>
        </form>
    </div>
</div>

<div mat-dialog-actions>
    <div class="flex items-center justify-end">
        <button mat-stroked-button type="button" (click)="close()">
            <mat-icon svgIcon="heroicons_outline:x-circle"></mat-icon>Cancelar
        </button>
        <button
            *ngIf="!readonlyMode"
            class="ml-4"
            mat-flat-button
            type="button"
            [color]="'primary'"
            (click)="guardarDatos()"
        >
            <mat-icon svgIcon="mat_outline:save"></mat-icon>Guardar
        </button>
    </div>
</div>
